<style>
/* Layout: one-screen instrument. Transport, track tabs, track bar, then a canvas holding the
   sequencer lane, the two performance strips and the effect grid. Single dark stage look. */
:root{
  color-scheme: dark;
  --bg:#111317;--panel:#1a1d23;--raise:#242831;--line:#2f3440;--fg:#ece7dc;--dim:#8a8f99;--accent:#ffc65c;--rec:#e5484d;
  --mono:"Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;overflow:hidden;
  padding-inline:16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:7px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.brand{font-weight:700;font-stretch:75%;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--accent)}
button,select{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:6px;height:32px;padding:0 9px;cursor:pointer}
button:focus-visible,select:focus-visible,.drag:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.play{background:var(--accent);color:#1b1408;border-color:transparent;font-weight:700;min-width:70px}
.play[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.toggle[aria-pressed="true"]{background:#3a3120;border-color:var(--accent);color:var(--accent)}
.recbtn[aria-pressed="true"]{background:#3a1d1f;border-color:var(--rec);color:#ffb4b4}

.drag{height:32px;display:inline-flex;align-items:baseline;gap:5px;padding:0 10px;border:1px dashed var(--line);border-radius:6px;background:var(--panel);
  cursor:ns-resize;touch-action:none;font-variant-numeric:tabular-nums;line-height:30px}
.drag b{font-weight:600;font-size:13px}.drag small{color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.k{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 8px;border-radius:7px;background:var(--panel);border:1px solid var(--line);min-width:0;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--accent);background:#2a2619}
.tab .n{font-weight:700;color:var(--accent)}
.tab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--dim)}
.tab[aria-selected="true"] .nm{color:var(--fg)}
.tab .mt{height:22px;width:24px;padding:0;font-size:10px;border-radius:5px;flex:none}
.tab .mt[aria-pressed="true"]{background:#3a2020;color:#ff9b9b;border-color:#6a3030}
.tab i{width:6px;height:6px;border-radius:50%;background:#3a3f4a;flex:none}
.tab i.on{background:var(--accent)}
.clips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:26px}
.clips::-webkit-scrollbar{display:none}
.chip{height:24px;border-radius:12px;padding:0 10px;font-size:11px;display:inline-flex;align-items:center;gap:6px;background:var(--panel);flex:none}
.chip.sel{background:var(--raise)}
.chip.now{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.chip.queued{box-shadow:inset 0 0 0 1.5px #6c6450}
.hint{color:var(--dim);font-size:11px}
.gridwrap{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.sheet{position:fixed;inset:0;background:rgba(5,6,8,.72);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding:16px}
.sheet .card{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card h3{margin:0 0 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:500}
.card label{display:flex;align-items:center;gap:8px;min-height:28px;cursor:pointer}
.card .opt{display:flex;flex-direction:column;gap:2px}
.card input[type=range]{width:100%;accent-color:var(--accent)}
.card .val{color:var(--dim);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.card .line{display:flex;align-items:center;gap:10px}
.card .line span:first-child{min-width:110px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:28px;height:28px;padding:0;border-radius:50%}
.swatches button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.card .close{align-self:flex-end}
.card p{margin:0;color:var(--dim);line-height:1.5}

.session{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.sess-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess-scroll{flex:1;min-height:0;overflow:auto;border-radius:8px;background:#15171c}
.song{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.sgrid{display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr)) 28px;gap:4px;padding:6px}
.sgrid .hd{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;white-space:nowrap;height:22px}
.sgrid .hd i{width:8px;height:8px;border-radius:2px;flex:none}
.slot{position:relative;height:46px;border-radius:7px;background:#1c1f25;border:1px solid #262a32;min-width:0;cursor:pointer;touch-action:none;overflow:hidden}
.slot canvas{position:absolute;inset:0;width:100%;height:100%}
.slot .lb{position:absolute;left:5px;top:3px;font-size:9px;color:rgba(236,231,220,.8);pointer-events:none;letter-spacing:.04em}
.slot.sel{border-color:#fff;box-shadow:0 0 0 1.5px #fff}
.slot.play::after{content:"";position:absolute;right:5px;top:5px;border-left:7px solid var(--accent);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}

.slot.over{outline:2px dashed var(--accent);outline-offset:-2px}
.slot.scene{background:#1f1c15}
@keyframes pulse{to{border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.slot.queued{animation:none;border-color:var(--accent)}}
.launch{height:46px;padding:0;font-size:13px;touch-action:none}
.launch.on{background:#3a3120;color:var(--accent);border-color:var(--accent)}
.stopb{height:28px;padding:0;font-size:11px}
.rowx{height:46px;padding:0;font-size:12px;color:var(--dim)}
.addrow{grid-column:1 / -1;height:28px}
.ghost{position:fixed;width:70px;height:40px;border-radius:7px;border:1.5px solid var(--accent);background:rgba(36,40,49,.85);pointer-events:none;z-index:9;transform:translate(-50%,-60%);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--accent)}

.knob{position:relative;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;cursor:ns-resize;touch-action:none;border-radius:7px}
.knob::before{content:"";width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#30343e,#1b1e24);border:1.5px solid hsl(var(--h,40) 60% 45%)}
.knob i{position:absolute;top:2px;left:50%;width:2px;height:12px;margin-left:-1px;background:hsl(var(--h,40) 80% 65%);border-radius:1px;transform-origin:50% 13px}
.knob span{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.knob:focus-visible{outline:2px solid var(--accent)}
.keys{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:8px}
.keys button{height:44px;padding:0;font-size:10px;border-radius:5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.keys .wht{background:#d9d4c8;color:#1b1408;border-color:#a7a194}
.keys .blk{background:#2a2d34;color:#c9c4b8;height:34px}
.keys button[aria-pressed="true"].wht{background:#ffc65c;border-color:#e0a73c}
.keys button[aria-pressed="true"].blk{background:#b07d22;color:#fff3d6;border-color:#ffc65c}
.card select{width:100%}

.top{gap:6px}
.ic{width:36px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:20px;height:20px;display:block}
.ic.play{width:46px;background:var(--accent);color:#1b1408;border-color:transparent}
.ic.play[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.recbtn svg circle{fill:var(--rec)}
.recbtn.waiting{animation:breathe 1s ease-in-out infinite}
.recbtn.on{background:#3a1d1f;border-color:var(--rec)}
.recbtn.on svg circle{fill:#ff8080}
.drag{width:88px;justify-content:center}
.pair{display:inline-flex;gap:4px;white-space:nowrap}
.pair button:disabled{opacity:.38;cursor:default}
.grow{flex:1}
.msg{height:16px;line-height:16px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.rec{color:#ff9b9b}
.tab{justify-content:space-between}
.tab .sb{height:22px;width:26px;padding:0;font-size:10px;border-radius:5px;flex:none}
.tab .sb[aria-pressed="true"]{background:#2b3a1f;color:#b5f08a;border-color:#4b6a30}
.tab.dim,.hd.dim,.slot.dim,.knob.dim{opacity:.42}
.songtitle{margin:2px 0 0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sess-scroll{overflow-y:scroll;scrollbar-width:thin;scrollbar-color:#4a5060 #15171c}
.sess-scroll::-webkit-scrollbar{width:8px;height:8px}
.sess-scroll::-webkit-scrollbar-thumb{background:#4a5060;border-radius:4px}
.sess-scroll::-webkit-scrollbar-track{background:#15171c}
.trh{display:flex;align-items:center;justify-content:space-between;gap:3px;height:30px;border-radius:7px;background:var(--panel);border:1px solid var(--line);padding:0 4px 0 7px;min-width:0;cursor:pointer}
.trh[aria-selected="true"]{border-color:var(--accent);background:#2a2619}
.trh .n{font-weight:700}
.trh .bx{display:flex;gap:3px}
.trh .bx button{height:20px;width:22px;padding:0;font-size:9px;border-radius:4px}
.trh .bx .mt[aria-pressed="true"]{background:#3a2020;color:#ff9b9b;border-color:#6a3030}
.trh .bx .sb[aria-pressed="true"]{background:#2b3a1f;color:#b5f08a;border-color:#4b6a30}
.slot.queued,.launch.queued{animation:breathe .9s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1.5px rgba(255,198,92,.15)}50%{box-shadow:0 0 0 2px rgba(255,198,92,.95)}}
.launch svg{width:14px;height:14px}
.launch.grab{cursor:grab}
.songrow-over{outline:2px dashed var(--accent);outline-offset:-2px}
.sheethead{position:sticky;top:-16px;margin:-16px -16px 0;padding:12px 12px 10px 16px;background:var(--panel);display:flex;align-items:center;gap:8px;z-index:2;border-bottom:1px solid var(--line)}
.sheethead h2{flex:1}
.sheethead .x{width:34px;height:34px;padding:0;font-size:18px;line-height:1}
.danger{border-color:#6a3030;color:#ff9b9b}
@media (prefers-reduced-motion:reduce){.slot.queued,.launch.queued,.recbtn.waiting{animation:none;box-shadow:0 0 0 2px rgba(255,198,92,.8)}}

/* portrait only: controls stacked over the grid */
.app{height:100%;display:flex;flex-direction:column;gap:7px;padding-block:10px;position:relative}
.side{display:flex;flex-direction:column;gap:7px;min-width:0}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.tgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;width:100%;max-width:560px}
.tgrid>*{width:100%;min-width:0;height:36px}
.tgrid .ic{width:100%}
.c23{grid-column:2/4}.c45{grid-column:4/6}.c78{grid-column:7/9}.c12{grid-column:1/3}.c34{grid-column:3/5}.c5{grid-column:5}.c6{grid-column:6}.c7{grid-column:7}.c8{grid-column:8}.c1{grid-column:1}.c2{grid-column:2}.c3{grid-column:3}.c4{grid-column:4}.c56{grid-column:5/7}
.tgrid .drag{width:100%;padding:0 6px}
.tgrid button:disabled{opacity:.38;cursor:default}
.lane{position:relative;inset:auto;width:100%;height:30px;display:block;touch-action:none;flex:none}
/* app-wide mode colour: normal, latched, global, and global + latched */
body{--accent:#ffc65c;transition:background-color .25s}
body.m-global{--accent:#7fb2ff;--bg:#0f1a2c;--panel:#16223a;background:var(--bg)}
.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,#1b1d22);border-color:var(--accent);color:var(--accent)}
.ic.play{background:var(--accent)}
.tab[aria-selected="true"]{border-color:var(--accent)}
.sbox{display:flex;flex-direction:column;gap:4px;align-items:stretch;padding:5px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0}
.sbox .top{display:flex;align-items:center;justify-content:space-between;gap:3px}
.sbox .n{font-weight:700}
.sbox .bx{display:flex;gap:3px}
.sbox .bx button{height:20px;width:22px;padding:0;font-size:9px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.sbox .bx svg{width:10px;height:10px}
.sbox .bx .mt[aria-pressed="true"]{background:#3a2020;color:#ff9b9b;border-color:#6a3030}
.sbox .bx .sb[aria-pressed="true"]{background:#2b3a1f;color:#b5f08a;border-color:#4b6a30}
.sbox .knob{height:42px}
.ptitle{grid-column:1/-1;text-align:center;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--fg);padding:2px 0 4px}
.stopall{height:100%;min-height:40px;padding:0;display:flex;align-items:center;justify-content:center}
.stopall svg{width:14px;height:14px}
.session{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.sess-scroll.song{flex:1}

.sbox{padding:4px}
.sbox .top{gap:2px}
.sbox .bx{gap:2px}
.sbox .bx button{width:20px;height:19px}
.sbox .low{display:flex;align-items:flex-start;justify-content:space-between;gap:2px}
.sbox .stp{width:20px;height:19px;padding:0;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sbox .stp svg{width:9px;height:9px}
.sbox .knob{flex:1;min-width:0}
.tab{padding:0 4px 0 7px;gap:4px}
.tab .bx{display:flex;gap:3px;flex:none}
.tab .bx button{height:22px;width:22px;padding:0;font-size:10px;border-radius:5px}
.tab .bx .mt[aria-pressed="true"]{background:#3a2020;color:#ff9b9b;border-color:#6a3030}
@media (max-width:520px){ .brand{display:none} button,select{height:30px;padding:0 7px} .drag{height:30px;line-height:28px} .tab .nm{font-size:10px} }
/* header additions */
.tgrid .sm{padding:0 2px;font-size:11px;letter-spacing:.02em}
.ic.play{width:100%}
.capbtn.waiting{animation:breathe 1s ease-in-out infinite}
.capbtn:disabled{opacity:.38;cursor:default}
.recbtn.dub svg circle{fill:#ffb36b}
.recbtn.on.dub{border-color:#ff9a4a;background:#3a2a1d}
#recmode[aria-pressed="true"]{background:#3a2a1d;border-color:#ff9a4a;color:#ffc08a}
.tgrid .drag{height:36px;line-height:34px}
.foldbtn{width:34px;height:30px;flex:none}
.knob span{display:block;width:100%;height:12px;line-height:12px;text-align:center;white-space:nowrap;overflow:hidden}
.sbox .knob{height:42px;overflow:hidden}
.blen-ctl{align-items:center}
.blen-ctl button{width:30px;padding:0}
.blen{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;color:var(--fg)}
.gridrow{flex-wrap:wrap}
#clear.armed{background:#3a1d1f;border-color:var(--rec);color:#ffb4b4}
/* settings sheet: vertical sliders */
.vrow{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.vcol{display:flex;flex-direction:column;align-items:center;gap:5px;width:86px}
.vname{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.vval{font-size:11px;font-variant-numeric:tabular-nums;color:var(--fg);min-height:15px;text-align:center;white-space:nowrap}
.vtrack{position:relative;width:40px;height:170px;border-radius:8px;background:#121418;border:1px solid var(--line);touch-action:none;cursor:ns-resize}
.vtrack:focus-visible{outline:2px solid var(--accent)}
.vtrack .vzero{position:absolute;left:4px;right:4px;top:50%;height:1px;background:#4a5060;text-decoration:none}
.vtrack .vfill{position:absolute;left:6px;right:6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.vtrack .vth{position:absolute;left:-4px;right:-4px;height:6px;margin-top:-3px;border-radius:3px;background:var(--accent)}
.vtrack .vth.lo{background:#1b1d22;border:2px solid var(--accent)}
.vcol:not(.cell) .vfill{background:#3a3f4a}
.vcb{display:flex;align-items:center;gap:5px;font-size:11px;min-height:24px}
.gridrow{display:flex;align-items:center;gap:10px;min-height:34px}
.gridrow .n{font-weight:700;width:14px}
.seg{display:inline-flex;gap:4px}
.seg button{height:28px;padding:0 10px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:#2a2619}
.warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;margin:2px 0 6px;border-radius:8px;border:1px solid #6a3030;background:#2a1a1c;color:#ffcfcf;font-size:11px}
.warn .wb{display:inline-flex;gap:6px}
.warn button{height:28px}
/* one channel: clips and song side by side, one column each */
.session{flex-direction:row;gap:8px}
.session .sess-scroll{flex:1;min-width:0}
.sgrid.clipcol{grid-template-columns:minmax(0,1fr)}
.sgrid.songcol{grid-template-columns:30px minmax(0,1fr) 24px}
.sgrid .slot{height:44px}
.sgrid .launch,.sgrid .rowx{height:44px}
.slot .lb{font-size:9px;top:3px;left:5px;color:rgba(236,231,220,.7)}
.stopall{height:30px;min-height:30px;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.stopall svg{width:11px;height:11px}
/* randomizer: a die that slides along a two-button-wide track and rolls home on release */
.dice{position:relative;height:36px;border-radius:6px;background:var(--panel);border:1px solid var(--line);touch-action:none;cursor:ew-resize;overflow:hidden}
.dice::before{content:"";position:absolute;left:34px;right:8px;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:linear-gradient(90deg,#2f3440,#6c6450)}
.dice.held{border-color:var(--accent)}
.dice i{position:absolute;left:2px;top:2px;width:30px;height:30px;border-radius:6px;background:var(--raise);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg);will-change:transform}
.dice.held i{background:#3a3120;border-color:var(--accent);color:var(--accent)}
.dice i svg{width:20px;height:20px}
.dice span{position:absolute;right:6px;top:0;line-height:34px;font-size:10px;color:var(--accent);pointer-events:none;font-variant-numeric:tabular-nums}
.dice span.left{right:auto;left:8px}
.dice:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tiny{font-size:9px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;padding:0 2px}
#fxonly[aria-pressed="true"]{background:#1d2f2a;border-color:#5ee0b4;color:#8ff0cf}
.trash.held{background:#3a1d1f;border-color:var(--rec);color:#ffb4b4}
.expclips{display:flex;flex-wrap:wrap;gap:6px}
.expclips button{min-width:40px}
.expmsg{color:var(--accent)!important;min-height:18px}
.clipset{width:auto;padding:0 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
#trackbar{flex-wrap:nowrap;gap:6px}
#trackbar select{min-width:0;flex:1 1 auto;max-width:200px}
#trackbar .grow{flex:0 1 4px}
.foldbtn:disabled{opacity:.35;cursor:default}
</style>

<div class="app" id="app">

<script>
/*ENGINE START*/
function engineFactory(){
  const DIV=[4,8,16,32,64,128];
  const DT=[1,2,3,4,6,8],DLAB=['1/16','1/8','3/16','1/4','3/8','1/2']; // delay times in sixteenths
  const AUTO=16; // automation points recorded per step in smooth mode
  const step=(v,n)=>Math.min(n-1,Math.max(0,Math.floor(v*n)));

  const NOTES=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];

  const SCALE_CHOICES=[['chrom','Chromatic'],['major','Major'],['minor','Natural minor'],['pmaj','Major pentatonic'],['pmin','Minor pentatonic'],['oct5','Octaves and fifths'],['oct','Octaves'],['custom','Custom']];
  const maskOf=list=>{const m=new Array(12).fill(false);list.forEach(i=>m[i]=true);return m;};
  // Pitch quantised to a scale: the cell's travel is spread over just the allowed notes.
  function scaleNotes(mask,dir){const out=[];for(let s=1;s<=12;s++){const pc=dir>0?s%12:(12-s%12)%12;if(!mask||mask[pc])out.push(dir*s);}return out;}

  const semiLab=(v,o)=>{const s=semiQ(v,o);return sgn(s)+' st'+(s?' · '+NOTES[((s%12)+12)%12]:'');};
  // Effect schema. Values are normalised 0..1 (bipolar ones −1..1). `cells` lists the parameters
  // the cell's height controls by default.
  const FX={
    stutter:{name:'Stutter',hue:8,cells:['len'],
      params:{len:{name:'Length',def:0.5,lab:(v,o)=>o&&o.mode==='ms'?Math.round(stMs(v))+' ms':'1/'+DIV[step(v,6)],steps:o=>o&&o.mode==='ms'?0:6}},
      opts:{mode:{name:'Timing',def:'grid',choices:[['grid','Note values'],['ms','Milliseconds']]}}},
    random:{name:'Random slice',hue:44,cells:['chance'],
      params:{chance:{name:'Chance',def:1,lab:pct},

    pitch:{name:'Pitch',hue:318,cells:['semi'],tall:true,
      opts:{scale:{name:'Scale',def:'chrom',choices:SCALE_CHOICES}},
      params:{semi:{name:'Pitch',def:0,bip:true,lab:semiLab}}},
    reverse:{name:'Reverse',hue:166,cells:[],params:{}},
    env:{name:'Decay',hue:90,cells:['dec'],
      params:{dec:{name:'Decay',def:1,lab:v=>v>=0.985?'full':Math.round(envMs(v))+' ms'}}},
    freeze:{name:'Freeze',hue:190,cells:['semi'],
      opts:{scale:{name:'Scale',def:'chrom',choices:SCALE_CHOICES}},
      params:{semi:{name:'Pitch',def:0,bip:true,lab:semiLab}}},
    crush:{name:'Crush',hue:262,cells:['rate'],
      params:{rate:{name:'Rate',def:0.5,lab:v=>fmtHz(crHz(v))}}},

    delay:{name:'Delay',hue:130,cells:['send'],
      params:{send:{name:'Send',def:1,lab:pct},
              time:{name:'Time',def:(2+0.5)/6,lab:v=>DLAB[step(v,6)]},
              fb:{name:'Feedback',def:0.55,lab:pct}}},
    filter:{name:'Filter',hue:40,cells:['cut'],
      params:{cut:{name:'Cutoff',def:0,bip:true,lab:v=>v>0?'HP '+fmtHz(hpHz(v)):v<0?'LP '+fmtHz(lpHz(-v)):'off'},

  };
  // Per-track effect settings. A touch stores only its raw cell position; the value it plays is
  // worked out from these settings every time, so changing them changes recorded sequences too.
  function defCfg(k){
    const d=FX[k],c={cells:d.cells.slice(),lo:{},hi:{},x:{},o:{}};
    for(const n in d.params){const P=d.params[n];c.x[n]=P.def;c.lo[n]=P.bip?-1:0;c.hi[n]=1;}
    if(d.opts)for(const n in d.opts)c.o[n]=d.opts[n].def;

  }
  function allCfg(){const o={};for(const k in FX)o[k]=defCfg(k);return o;}
  function rowBip(c,k){const P=FX[k].params;for(const n of c.cells)if(P[n]&&P[n].bip)return true;return false;}

  function resolveInto(v,c,k,raw){

        const lo=c.lo[n],hi=c.hi[n];
        if(P[n].bip)v[n]=raw>0?raw*hi:raw<0?-raw*lo:0;
        else v[n]=bip?lo+(raw+1)/2*(hi-lo):lo+raw*(hi-lo);
      }else v[n]=c.x[n];
    }
    return v;
  }
  const resolve=(c,k,raw)=>resolveInto({},c,k,raw);
  const emptyStep=i=>({empty:true,on:true,a:0,off:0,sid:'E'+i,slen:1,fx:[]});

  const ss=x=>x*x*(3-2*x); // smoothstep: fades without a corner at either end
  // Seeded randomness: a clip's random choices (play order, silence, random slice) come from its seed and the
  // pass number within its variation cycle, so the same cycle repeats exactly, live and in exports.
  function seedMix(seed,pass){let h=(seed^Math.imul(pass+1,0x9E3779B1))|0;h=Math.imul(h^h>>>16,0x85EBCA6B);h=Math.imul(h^h>>>13,0xC2B2AE35);return (h^h>>>16)|0;}
  function rdM(b,m,pos){const i=Math.floor(pos),f=pos-i;const a=b[i&m];return a+(b[(i+1)&m]-a)*f;}
  function rdW(b,n,pos){pos=((pos%n)+n)%n;const i=Math.floor(pos),f=pos-i,j=i+1>=n?0:i+1;return b[i]+(b[j]-b[i])*f;}
  function softclip(x){if(!(x<8&&x>-8))return x>=8?1:(x<=-8?-1:0);const a=Math.abs(x);if(a<0.8)return x;return (x<0?-1:1)*(0.8+0.2*Math.tanh((a-0.8)/0.2));}

  // One track: its loop, grid, touches, clip and effect state.
  // At every grid step the track decides what plays: looping touches take turns; otherwise the clip's
  // step (in play order); otherwise the raw loop (in play order). What plays is what gets recorded.
  class Track{
    constructor(E,i){
      this.E=E;this.i=i;this.L=null;this.R=null;this.cols=16;this.sl=0;this.s16=0;this.e16=16;
      this.vol=1;this.muted=false;this.tg=1;this.cfg=allCfg();this.cfgV=0;
      // play order and silence: the plain loop's own settings, a clip's stored ones, and a live (unpinned) override
      this.ord={mode:'fwd',r:0};this.mute={rnd:0,bits:null};this.muteQ=null;this.ordLive=null;this.muteLive=null;
      this.seed=1;this.varLen=0;this.rs=0;this.rsOn=false;this.cBar=-1;this.cCtx=undefined;
      this.gate=true;this.gG=1;this.rest=false;
      this.touches=[];this.rotLast=null;this.rotLastO=-1;this.anch=null;
      this.clip=null;this.clipQ=undefined;this.cpos=-1;this.songSilent=false;this.launchNow=null;
      this.rec=null;this.hist=[];this.barPos=-1;this.barN=-1;this.bsnap=null;this.recPend=null;
      this.cur=null;this.tlS=0;this.first=true;this.sidC=0;this.k=0;this.newStep=false;
      this.rp=0;this.rdir=1;this.xp=0;this.xdir=1;this.xf=0;this.xstep=1/96;
      this.dcL=0;this.dcR=0;this.lastL=0;this.lastR=0;
      this.rN=1<<14;this.rm=this.rN-1;this.rL=new Float32Array(this.rN);this.rR=new Float32Array(this.rN);
      this.pPh=0;this.pSem=0;this.pMix=0;this.hadPitch=false;
      this.gr=[];this.gNext=0;this.cAcc=1;this.cl=0;this.cr=0;this.fs=new Float64Array(4);
      this.dN=1<<17;this.dm=this.dN-1;this.dL=new Float32Array(this.dN);this.dR=new Float32Array(this.dN);this.dW=0;
      this.dSend=0;this.dTime=0;this.dFb=0.55;this.dTv=0;this.dlp1=0;this.dlp2=0;
    }
    get ordE(){return this.ordLive||(this.clip&&this.clip.ord)||this.ord;}
    get muteE(){return this.muteLive||(this.clip&&this.clip.mute)||this.mute;}
    // musical randomness: seeded per pass when the context repeats, otherwise truly random
    rnd(){
      if(!this.rsOn)return Math.random();
      let a=this.rs=(this.rs+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;
    }
    get s(){return Math.round(this.s16*this.cols/16);}
    get e(){return Math.max(this.s+1,Math.round(this.e16*this.cols/16));}
    get n(){return this.e-this.s;}
    setGrid(n){
      const old=this.cols;this.cols=n;
      if(this.E.len)this.sl=Math.floor(this.E.len/n);
      this.tlS=Math.round(this.tlS*n/old);this.clampTl();

    }
    applyGrid(n){
      this.setGrid(n);this.first=true;this.barPos=0;this.cpos=-1;this.hist=[];

    }
    clampTl(){const s=this.s,n=this.n;if(this.tlS<s||this.tlS>=s+n)this.tlS=s+((((this.tlS-s)%n)+n)%n);}
    reset(){
      this.cur=null;this.first=true;this.tlS=this.s;this.rotLast=null;this.anch=null;this.gr.length=0;this.dcL=this.dcR=0;
      this.xf=0;this.rp=-1;this.rdir=1;this.hist=[];this.barPos=-1;this.barN=-1;this.cpos=-1;this.bsnap=null;this.recPend=null;
      this.cBar=-1;this.cCtx=undefined;this.dL.fill(0);this.dR.fill(0);this.dSend=0;this.dlp1=this.dlp2=0;

    mkE(f){return {k:f.k,raw:f.raw,auto:f.auto||null,tid:f.tid||null,live:null,v:{},o:null,rv:NaN,cv:-1,ref:null};}

    }
    relink(){

        const i=L.findIndex(x=>x.id===this.rotLast);

    }
    snapshot(){
      const c=this.cur,r=this.rec;
      return {tlS:this.tlS,first:this.first,rotLast:this.rotLast,rotLastO:this.rotLastO,cpos:this.cpos,anch:this.anch,rs:this.rs,
        hist:this.hist.length,rec:r?r.slots.length:-1,cur:c,left:c?c.left:0,off:c?c.off:0,gate:this.gate,rest:this.rest,hadPitch:this.hadPitch};

    restore(s){
      this.tlS=s.tlS;this.first=s.first;this.rotLast=s.rotLast;this.rotLastO=s.rotLastO;this.cpos=s.cpos;this.anch=s.anch;this.rs=s.rs;

          let flat=true;for(let i=1;i<AUTO;i++)if(Math.abs(a[i]-a[0])>1e-4){flat=false;break;}
          if(flat){f.raw=a[0];delete f.auto;}else f.raw=a[0];
        }
        c.recRefs=false;
      }
      if(this.recPend){const p=this.recPend;this.recPend=null;this.E.emit({type:'clipStep',tr:this.i,id:p.id,idx:p.idx,slot:p.slot});}
    }
    boundary(t,k){
      const E=this.E;
      this.finalize();
      this.k=k;
      const n=this.n;
      this.barPos=this.barPos<0?0:(this.barPos+1)%n;

        if(r.closing&&bar)this.finishRec();
        else if(!r.over&&!r.wait&&bar&&r.slots.length>=r.L){

          // it (replacing or combining, following the mode) until record is pressed again
          r.slots.length=r.L;this.finishRec();
          this.rec={id:r.id,over:true,wait:false,closing:false,slots:[]};
        }

        this.clip=this.clipQ;this.clipQ=undefined;this.cpos=-1;this.songSilent=false;
      }

        // each bar of a repeating variation cycle starts from the same random numbers, so the cycle repeats
        const c=this.clip,id=c?c.id:null;

        // a cycle is the clip's length times the variation length; positions restart with each cycle
        const cb=c&&c.slots?Math.max(1,Math.ceil(c.slots.length/(c.n||this.n))):1;
        if(vl>0){const pass=this.cBar%(cb*vl);if(pass===0){this.cpos=-1;this.first=true;}this.rs=seedMix(sd,pass);this.rsOn=true;}

    finishRec(){

      if(!r.slots.length)return;

    }
    decide(t,k){
      const E=this.E,u=E.u,sl=this.sl,pref=E.pref;
      const c=this.cur;if(c)c.left--;
      const clip=this.clip&&this.clip.slots.length?this.clip:null;
      // Two independent switches decide what touches do:
      //   FX only off: touched slices take turns.      FX only on: the sequence (or loop) keeps its slices.
      //   Replace: each step plays one touch's effect. Combine: every held effect stacks on each step;
      //            when one effect is held twice, the most recent touch's value wins.
      const r=this.rec,combine=E.mode==='combine',fxOnly=E.fxOnly,dub=!!(r&&r.over&&!r.wait&&fxOnly&&clip&&clip.id===r.id);
      const loopT=fxOnly&&combine?[]:this.touches,applied=combine?this.touches.filter(x=>x.fx):[];
      const pre={tlS:this.tlS,first:this.first,rotLast:this.rotLast,rotLastO:this.rotLastO,cpos:this.cpos};
      // advance the underlying sequence positions
      let slot=null,cIdx=-1;
      if(clip){cIdx=this.cpos=this.stepOrder(this.cpos,clip.slots.length);slot=clip.slots[cIdx];}

      if(P)for(const m of rm)if(m.finger){const yy=r.y+r.h*(1-rawToRel(t,k,m.raw));g.setLineDash([3,3]);g.strokeStyle=`hsla(${hue} 85% 72% / .55)`;g.lineWidth=1;g.beginPath();g.moveTo(HW,yy);g.lineTo(cssW,yy);g.stroke();g.setLineDash([]);}
      if(P)for(const L of lines){const yy=r.y+r.h*(1-rawToRel(t,k,L.raw));g.strokeStyle=`hsl(${hue} 85% 72%)`;g.lineWidth=1.5;g.beginPath();g.moveTo(L.x0,yy);g.lineTo(L.x1,yy);g.stroke();}
      const latest=(rm.length?rm.reduce((x,y)=>y.ts>x.ts?y:x):null);
      g.textBaseline='middle';const ty=d.tall||cellBip(t,k)?r.y+Math.min(12,r.h*(1-BAND_HI)/2+1):r.y+r.h/2;
      g.font=`600 ${fs}px ${FONT}`;g.textAlign='left';g.fillStyle=latest?`hsl(${hue} 90% 84%)`:`hsl(${hue} 50% 64%)`;
      g.fillText(d.name.toUpperCase(),HW+8,ty);
      g.font=`400 ${fs}px ${FONT}`;g.textAlign='right';g.fillStyle=latest?'#fff':`hsl(${hue} 14% 52%)`;
      let lab='';
      if(P){if(latest){const v=resolve(t,k,latest.raw);lab=cn.map(n=>d.params[n].lab(v[n],c.o)).join(' · ');}
        else lab=P.bip?P.lab(c.lo[pn],c.o)+' ↓  ↑ '+P.lab(c.hi[pn],c.o):P.lab(c.lo[pn],c.o)+' → '+P.lab(c.hi[pn],c.o);}
      g.fillText(lab,cssW-12,ty);
    });
    const y0=lay.length?lay[0].y:TOP;
    // columns past this track's bar length still play their slices, but sit outside the bar
    const xe=cellX(t,t.len16);if(xe<cssW-1){g.fillStyle='rgba(10,11,14,.42)';g.fillRect(xe,y0,cssW-xe,cssH-y0);}
    // the current step when it is silenced
    if(st.playing&&i.gate===false&&i.src){g.fillStyle='rgba(10,11,14,.5)';const x=i.rest?HW+((i.s+Math.max(0,i.barPos))%cols)*cw:HW+curSlice*cw;if(x>=HW)g.fillRect(x,y0,cw,cssH-y0);}
    if(folded)drawSlim(fs);else drawStrips(fs);
    g=laneG;laneG.setTransform(laneDpr,0,0,laneDpr,0,0);laneG.fillStyle=BG;laneG.fillRect(0,0,LW,laneRows*LROW+6);
    if('letterSpacing' in laneG)laneG.letterSpacing='0.06em';drawLane(fs);g=gridG;
    for(const p of ptrs.values())if(p.tr===view){g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,17,0,Math.PI*2);g.stroke();}
    // a grabbed effect row is outlined; while dragging, a copy follows the finger and a line shows where it lands
    for(const sp of special.values())if(sp.kind==='handle'){
      const r=lay.find(x=>x.id===sp.id);if(!r)continue;
      g.strokeStyle=ACC;g.lineWidth=2;rr(1,r.y+1,cssW-2,r.h-2,6);g.stroke();
      g.fillStyle=ACCA(.10);g.fillRect(0,r.y,cssW,r.h);
      if(sp.moved){
        const gh=Math.min(r.h,40);g.globalAlpha=0.9;g.fillStyle='#2a2619';rr(4,sp.y-gh/2,cssW-8,gh,6);g.fill();g.strokeStyle=ACC;g.lineWidth=1.5;rr(4,sp.y-gh/2,cssW-8,gh,6);g.stroke();
        g.fillStyle=ACC;g.font=`600 ${fs}px ${FONT}`;g.textAlign='left';g.textBaseline='middle';g.fillText((sp.id==='center'?'LOOP':FX[sp.id].name.toUpperCase()),HW+8,sp.y);g.globalAlpha=1;
        let target=lay.findIndex(x=>sp.y<x.y+x.h/2);const yy=target<0?lay[lay.length-1].y+lay[lay.length-1].h+1:lay[target].y-2;
        g.fillStyle=ACC;g.fillRect(0,yy-1,cssW,3);
      }
    }
    // a track that is muted, or silenced by another track's solo, is dimmed
  }
  function drawCenter(t,i,r,ri,curSlice,marks,touch,cw,gap,fs,nowHid){
    const cols=t.cols,bot=r.y+r.h,fm=marks.filter(m=>m.fx==='filter'),dm=marks.filter(m=>m.fx==='dry'),fh=t.cfg.filter.hue;
    for(let col=0;col<cols;col++){g.fillStyle=col===curSlice?'#252931':'#1a1d23';rr(HW+col*cw+gap/2,r.y,cw-gap,r.h,6);g.fill();}
    for(const m of dm){const now=nowHid===m.hid;g.fillStyle=now?'#3a3527':'#2a2822';rr(cellX(t,m.a)+gap/2,r.y,m.n/16*W()-gap,r.h,6);g.fill();}
    for(let col=0;col<cols;col++)if(touch.has(ri+':'+col)){g.fillStyle='#343a46';rr(HW+col*cw+gap/2,r.y,cw-gap,r.h,6);g.fill();}
    const fz=(x0,x1,raw,now)=>{const hp=raw>0;g.fillStyle=hp?`hsla(${fh} 85% 60% / ${now?0.36:0.2})`:`hsla(${(fh+160)%360} 85% 60% / ${now?0.36:0.2})`;
      if(hp)g.fillRect(x0,r.y,x1-x0,r.z1-r.y);else g.fillRect(x0,r.z2,x1-x0,bot-r.z2);};
    for(const s of fm)fz(cellX(t,s.a)+gap/2,cellX(t,s.a+s.n)-gap/2,s.raw,nowHid===s.hid);
    const pk=t.pk;
    if(pk){
      const mid=r.y+r.h/2,amp=r.h*0.46,B=pk.length/2,c0=HW+curSlice*cw,c1=c0+cw;
      for(const pass of [0,1]){
        g.beginPath();
        for(let x=HW;x<cssW;x+=1){const inSl=x>=c0&&x<c1;if(pass===0&&inSl||pass===1&&!inSl)continue;
          const k=Math.min(B-1,Math.floor((x-HW)/W()*B));g.moveTo(x+0.5,mid-pk[k*2+1]*amp);g.lineTo(x+0.5,mid-pk[k*2]*amp+0.5);}
        g.strokeStyle=pass?'#ece7dc':'#6c7380';g.lineWidth=1;g.stroke();
      }
    }
    // a line at each held or latched filter value, like the other rows
    if(hasCell(t,'filter')){
      const fl=fm.map(m=>({x0:cellX(t,m.a)+gap/2+3,x1:cellX(t,m.a+m.n)-gap/2-3,raw:m.raw}));
      for(const m of fm)if(m.finger){const hp=m.raw>0,yy=hp?r.z1-(r.z1-r.y)*m.raw:r.z2+(bot-r.z2)*(-m.raw);g.setLineDash([3,3]);g.strokeStyle=hp?`hsla(${fh} 90% 72% / .55)`:`hsla(${(fh+160)%360} 90% 72% / .55)`;g.lineWidth=1;g.beginPath();g.moveTo(HW,yy);g.lineTo(cssW,yy);g.stroke();g.setLineDash([]);}
      for(const L of fl){const hp=L.raw>0,yy=hp?r.z1-(r.z1-r.y)*L.raw:r.z2+(bot-r.z2)*(-L.raw);
        g.strokeStyle=hp?`hsl(${fh} 90% 72%)`:`hsl(${(fh+160)%360} 90% 72%)`;g.lineWidth=1.5;g.beginPath();g.moveTo(L.x0,yy);g.lineTo(L.x1,yy);g.stroke();}
    }
    g.setLineDash([2,4]);g.strokeStyle='#8a8f99';g.lineWidth=1;g.beginPath();g.moveTo(HW,r.z1);g.lineTo(cssW,r.z1);g.moveTo(HW,r.z2);g.lineTo(cssW,r.z2);g.stroke();g.setLineDash([]);
    const latest=(fm.length?fm.reduce((x,y)=>y.ts>x.ts?y:x):null),P=FX.filter.params.cut;
    g.textBaseline='middle';g.font=`600 ${fs}px ${FONT}`;g.textAlign='left';
    const yHp=(r.y+r.z1)/2,yLp=(r.z2+bot)/2;
    g.fillStyle=latest&&latest.raw>0?`hsl(${fh} 90% 80%)`:`hsl(${fh} 40% 58%)`;g.fillText('HIGH-PASS ↑',HW+8,yHp);
    g.fillStyle=latest&&latest.raw<0?`hsl(${(fh+160)%360} 90% 80%)`:`hsl(${(fh+160)%360} 40% 60%)`;g.fillText('LOW-PASS ↓',HW+8,yLp);
    g.textAlign='right';g.font=`400 ${fs}px ${FONT}`;
    const lv=latest?P.lab(resolve(t,'filter',latest.raw).cut):'';
    g.fillStyle='#fff';if(latest&&latest.raw>0)g.fillText(lv,cssW-12,yHp);if(latest&&latest.raw<0)g.fillText(lv,cssW-12,yLp);
    g.textAlign='left';g.fillStyle='#8a8f99';g.font=`500 ${fs}px ${FONT}`;g.textBaseline='top';
    const every=cols>8&&cw<30?2:1;
    for(let col=0;col<cols;col+=every)g.fillText(String(col+1),HW+col*cw+gap/2+4,r.z1+4);
    if(st.playing&&i.src&&!i.rest){const x=HW+(i.pos/16)*W();g.fillStyle=ACC;g.fillRect(x-0.75,r.z1,1.5,r.z2-r.z1);}
  }

  // ---------- start ----------
  // the layout is portrait only; where the browser allows it, keep the screen upright
  try{const o=screen.orientation;if(o&&o.lock){const p=o.lock('portrait');if(p&&p.catch)p.catch(()=>{});}}catch(_){}
  paintIcons();setFold(false);dieEl.innerHTML=ICON.dice;
  (function pre(){let n=0;const nx=()=>{if(n>=tracks.length)return;const t=tracks[n++];if(!t.buf){t.buf=buildLoop(t,48000);t.pk=peaks(t.buf);}setTimeout(nx,10);};setTimeout(nx,0);})();
  requestAnimationFrame(draw);
})();

</script>
