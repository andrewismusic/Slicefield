<style>
/* Everything lives in the Slicefield element's shadow root, so none of these rules or ids reach the
   host page. Layout: one-screen instrument. Header, loop bar (with undo/redo), tools, sequencer lane,
   then a canvas holding the ORDER and SKIP strips and the effect grid (or the Clips list). Single dark stage look. */
:host{
  color-scheme: dark;display:block;height:100%;box-sizing:border-box;font-family:var(--mono);font-size:12px;color:var(--fg);
  --bg:#111317;--panel:#1a1d23;--raise:#242831;--line:#2f3440;--fg:#ece7dc;--dim:#8a8f99;--accent:#ffc65c;--rec:#e5484d;
  --mono:"Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
.app{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;overflow:hidden;
  padding-inline:16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:7px;padding-block:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.brand{font-weight:700;font-stretch:75%;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--accent)}
button,select{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:6px;height:32px;padding:0 9px;cursor:pointer}
button:focus-visible,select:focus-visible,.drag:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.play{background:var(--accent);color:#1b1408;border-color:transparent;font-weight:700;min-width:70px}
.play[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.toggle[aria-pressed="true"]{background:#3a3120;border-color:var(--accent);color:var(--accent)}
.recbtn[aria-pressed="true"]{background:#3a1d1f;border-color:var(--rec);color:#ffb4b4}

.drag{height:32px;display:inline-flex;align-items:baseline;gap:5px;padding:0 10px;border:1px dashed var(--line);border-radius:6px;background:var(--panel);
  cursor:ns-resize;touch-action:none;font-variant-numeric:tabular-nums;line-height:30px}
.drag b{font-weight:600;font-size:13px}.drag small{color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.k{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 8px;border-radius:7px;background:var(--panel);border:1px solid var(--line);min-width:0;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--accent);background:#2a2619}
.tab .n{font-weight:700;color:var(--accent)}
.tab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--dim)}
.tab[aria-selected="true"] .nm{color:var(--fg)}
.tab .mt{height:22px;width:24px;padding:0;font-size:10px;border-radius:5px;flex:none}
.tab .mt[aria-pressed="true"]{background:#3a2020;color:#ff9b9b;border-color:#6a3030}
.tab i{width:6px;height:6px;border-radius:50%;background:#3a3f4a;flex:none}
.tab i.on{background:var(--accent)}
.clips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:26px}
.clips::-webkit-scrollbar{display:none}
.chip{height:24px;border-radius:12px;padding:0 10px;font-size:11px;display:inline-flex;align-items:center;gap:6px;background:var(--panel);flex:none}
.chip.sel{background:var(--raise)}
.chip.now{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.chip.queued{box-shadow:inset 0 0 0 1.5px #6c6450}
.hint{color:var(--dim);font-size:11px}
.gridwrap{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.sheet{position:fixed;inset:0;background:rgba(5,6,8,.72);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding:16px}
.sheet .card{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card h3{margin:0 0 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:500}
.card label{display:flex;align-items:center;gap:8px;min-height:28px;cursor:pointer}
.card .opt{display:flex;flex-direction:column;gap:2px}
.card input[type=range]{width:100%;accent-color:var(--accent)}
.card .val{color:var(--dim);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.card .line{display:flex;align-items:center;gap:10px}
.card .line span:first-child{min-width:110px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:28px;height:28px;padding:0;border-radius:50%}
.swatches button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.card .close{align-self:flex-end}
.card p{margin:0;color:var(--dim);line-height:1.5}

.session{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.sess-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess-scroll{flex:1;min-height:0;overflow:auto;border-radius:8px;background:#15171c}
.song{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.sgrid{display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr)) 28px;gap:4px;padding:6px}
.sgrid .hd{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;white-space:nowrap;height:22px}
.sgrid .hd i{width:8px;height:8px;border-radius:2px;flex:none}
.slot{position:relative;height:46px;border-radius:7px;background:#1c1f25;border:1px solid #262a32;min-width:0;cursor:pointer;touch-action:none;overflow:hidden}
.slot canvas{position:absolute;inset:0;width:100%;height:100%}
.slot .lb{position:absolute;left:5px;top:3px;font-size:9px;color:rgba(236,231,220,.8);pointer-events:none;letter-spacing:.04em}
.slot.sel{border-color:#fff;box-shadow:0 0 0 1.5px #fff}
.slot.play::after{content:"";position:absolute;right:5px;top:5px;border-left:7px solid var(--accent);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}

.slot.over{outline:2px dashed var(--accent);outline-offset:-2px}
.slot.scene{background:#1f1c15}
@keyframes pulse{to{border-color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.slot.queued{animation:none;border-color:var(--accent)}}
.launch{height:46px;padding:0;font-size:13px;touch-action:none}
.launch.on{background:#3a3120;color:var(--accent);border-color:var(--accent)}
.stopb{height:28px;padding:0;font-size:11px}
.rowx{height:46px;padding:0;font-size:12px;color:var(--dim)}
.addrow{grid-column:1 / -1;height:28px}
.ghost{position:fixed;width:70px;height:40px;border-radius:7px;border:1.5px solid var(--accent);background:rgba(36,40,49,.85);pointer-events:none;z-index:9;transform:translate(-50%,-60%);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--accent)}

.knob{position:relative;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;cursor:ns-resize;touch-action:none;border-radius:7px}
.knob::before{content:"";width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#30343e,#1b1e24);border:1.5px solid hsl(var(--h,40) 60% 45%)}
.knob i{position:absolute;top:2px;left:50%;width:2px;height:12px;margin-left:-1px;background:hsl(var(--h,40) 80% 65%);border-radius:1px;transform-origin:50% 13px}
.knob span{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.knob:focus-visible{outline:2px solid var(--accent)}
.keys{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:8px}
.keys button{height:44px;padding:0;font-size:10px;border-radius:5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.keys .wht{background:#d9d4c8;color:#1b1408;border-color:#a7a194}
.keys .blk{background:#2a2d34;color:#c9c4b8;height:34px}
.keys button[aria-pressed="true"].wht{background:#ffc65c;border-color:#e0a73c}
.keys button[aria-pressed="true"].blk{background:#b07d22;color:#fff3d6;border-color:#ffc65c}
.card select{width:100%}

.top{gap:6px}
.ic{width:36px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:20px;height:20px;display:block}
.ic.play{width:46px;background:var(--accent);color:#1b1408;border-color:transparent}
.ic.play[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.recbtn svg circle{fill:var(--rec)}
.recbtn.waiting{animation:breathe 1s ease-in-out infinite}
.recbtn.on{background:#3a1d1f;border-color:var(--rec)}
.recbtn.on svg circle{fill:#ff8080}
.drag{width:88px;justify-content:center}
.pair{display:inline-flex;gap:4px;white-space:nowrap}
.pair button:disabled{opacity:.38;cursor:default}
.grow{flex:1}
.msg{height:16px;line-height:16px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.rec{color:#ff9b9b}
.tab{justify-content:space-between}
.tab .sb{height:22px;width:26px;padding:0;font-size:10px;border-radius:5px;flex:none}
.tab .sb[aria-pressed="true"]{background:#2b3a1f;color:#b5f08a;border-color:#4b6a30}
.tab.dim,.hd.dim,.slot.dim,.knob.dim{opacity:.42}
.songtitle{margin:2px 0 0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sess-scroll{overflow-y:scroll;scrollbar-width:thin;scrollbar-color:#4a5060 #15171c}
.sess-scroll::-webkit-scrollbar{width:8px;height:8px}
.sess-scroll::-webkit-scrollbar-thumb{background:#4a5060;border-radius:4px}
.sess-scroll::-webkit-scrollbar-track{background:#15171c}
.trh{display:flex;align-items:center;justify-content:space-between;gap:3px;height:30px;border-radius:7px;background:var(--panel);border:1px solid var(--line);padding:0 4px 0 7px;min-width:0;cursor:pointer}
.trh[aria-selected="true"]{border-color:var(--accent);background:#2a2619}
.trh .n{font-weight:700}
.trh .bx{display:flex;gap:3px}
.trh .bx button{height:20px;width:22px;padding:0;font-size:9px;border-radius:4px}
.trh .bx .mt[aria-pressed="true"]{background:#3a2020;color:#ff9b9b;border-color:#6a3030}
.trh .bx .sb[aria-pressed="true"]{background:#2b3a1f;color:#b5f08a;border-color:#4b6a30}
.slot.queued,.launch.queued{animation:breathe .9s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1.5px rgba(255,198,92,.15)}50%{box-shadow:0 0 0 2px rgba(255,198,92,.95)}}
.launch svg{width:14px;height:14px}
.launch.grab{cursor:grab}
.songrow-over{outline:2px dashed var(--accent);outline-offset:-2px}
.sheethead{position:sticky;top:-16px;margin:-16px -16px 0;padding:12px 12px 10px 16px;background:var(--panel);display:flex;align-items:center;gap:8px;z-index:2;border-bottom:1px solid var(--line)}
.sheethead h2{flex:1}
.sheethead .x{width:34px;height:34px;padding:0;font-size:18px;line-height:1}
.danger{border-color:#6a3030;color:#ff9b9b}
@media (prefers-reduced-motion:reduce){.slot.queued,.launch.queued,.recbtn.waiting{animation:none;box-shadow:0 0 0 2px rgba(255,198,92,.8)}}

/* portrait only: controls stacked over the grid */
.app{height:100%;display:flex;flex-direction:column;gap:7px;padding-block:10px;position:relative}
.side{display:flex;flex-direction:column;gap:7px;min-width:0}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.tgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;width:100%;max-width:560px}
.tgrid>*{width:100%;min-width:0;height:36px}
.tgrid .ic{width:100%}
.c23{grid-column:2/4}.c45{grid-column:4/6}.c78{grid-column:7/9}.c12{grid-column:1/3}.c34{grid-column:3/5}.c5{grid-column:5}.c6{grid-column:6}.c7{grid-column:7}.c8{grid-column:8}.c1{grid-column:1}.c2{grid-column:2}.c3{grid-column:3}.c4{grid-column:4}.c56{grid-column:5/7}

.lane{position:relative;inset:auto;width:100%;height:30px;display:block;touch-action:none;flex:none}
/* app-wide mode colour: normal, latched, global, and global + latched */

.tab[aria-selected="true"]{border-color:var(--accent)}

.sbox{padding:4px}

/* header additions */
.tgrid .sm{padding:0 2px;font-size:11px;letter-spacing:.02em}
.ic.play{width:100%}

.gridrow{flex-wrap:wrap}

/* settings sheet: vertical sliders */
.vrow{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.vcol{display:flex;flex-direction:column;align-items:center;gap:5px;width:86px}
.vname{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.vval{font-size:11px;font-variant-numeric:tabular-nums;color:var(--fg);min-height:15px;text-align:center;white-space:nowrap}

.vtrack:focus-visible{outline:2px solid var(--accent)}

/* Takes: one scrolling column, oldest at the top */
.session{flex-direction:column}
.takeshead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.takeshead h2{margin:0 auto 0 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.takeshead button{height:30px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.takeshead button svg{width:12px;height:12px}
.takeshead button[aria-pressed="true"]{background:#3a3120;border-color:var(--accent);color:var(--accent)}
.takelist{display:flex;flex-direction:column;gap:4px;padding:6px}
.take{display:grid;grid-template-columns:26px minmax(0,1fr) 76px 28px 26px;gap:4px;align-items:stretch;height:44px}
.take .hdl{display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--panel);color:#6c7380;cursor:grab;touch-action:none}
.take .hdl svg{width:14px;height:14px}
.take .th{position:relative;border-radius:7px;background:#1c1f25;border:1px solid #262a32;overflow:hidden;cursor:pointer;padding:0}
.take .th canvas{position:absolute;inset:0;width:100%;height:100%}
.take .th span{position:absolute;left:5px;top:3px;font-size:9px;color:rgba(236,231,220,.75);pointer-events:none}
.take.now .th{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.take.now .th::after{content:"";position:absolute;right:6px;top:6px;border-left:7px solid var(--accent);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.take.cur .th{border-color:#8a8f99}
.take .reps{display:flex;align-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.take .reps button{height:100%;width:22px;padding:0;border:0;border-radius:0;background:transparent;font-size:13px;color:var(--dim)}
.take .reps span{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:11px}
.take .sel,.take .del{height:100%;padding:0;font-size:12px;color:var(--dim)}
.take .sel[aria-pressed="true"]{background:#3a3120;border-color:var(--accent);color:var(--accent)}
.take.drop{outline:2px dashed var(--accent);outline-offset:1px}
.takes-empty{color:var(--dim);line-height:1.6;padding:14px 8px}
.foldbtn:disabled{opacity:.35;cursor:default}
/* v19: header row 1 is transport and pages, row 2 the loop bar, row 3 the tools (they change with the page) */
.c35{grid-column:3/6}.c67{grid-column:6/8}
.tgrid .drag{flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;padding:0}
.tgrid .drag b{font-size:12px}.tgrid .drag small{font-size:7px;letter-spacing:.06em}
.recbtn[aria-pressed="true"]{background:#3a1d1f;border-color:var(--rec)}
.recbtn[aria-pressed="true"] svg circle{fill:#ff6b6b}
.capbtn.flash{animation:capflash .45s ease-out}
@keyframes capflash{from{background:var(--accent);color:#1b1408}}
#cliploop[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1b1408}
#dedupe,#loadclip{font-size:8px}
.take{grid-template-columns:26px minmax(0,1fr)}
.take.sel .th{border-color:#fff;box-shadow:0 0 0 1.5px #fff}
.take.held .th{border-color:var(--rec);box-shadow:0 0 0 1.5px var(--rec)}
.takeshead h2 small{font-size:10px;color:var(--dim);letter-spacing:.04em;text-transform:none;font-weight:400;margin-left:8px}
.delall{display:flex;gap:8px}
/* v20: the Clips button sits at the right end of the loop bar, one header column wide, right above Capture */
.c57{grid-column:5/8}
#trackbar{display:grid;grid-template-columns:auto minmax(0,1fr) repeat(3,calc((100% - 35px) / 8));gap:5px;max-width:560px;width:100%;align-items:center}
#trackbar select{max-width:none;width:100%}
#trackbar .grow{display:none}
#trackbar .ic{width:100%;height:30px}
.dropline{position:absolute;left:6px;right:6px;height:3px;margin-top:-2px;border-radius:2px;background:var(--accent);pointer-events:none;z-index:3}
.takelist{position:relative}
#loadclip{font-size:8px}
.projrow{display:flex;flex-wrap:wrap;gap:8px}
/* v21: clip rows drawn like the sequencer */
.take{height:auto;align-items:stretch}
.take .th{padding:0;background:transparent;border:1.5px solid transparent;border-radius:9px;height:auto}
.take .th canvas{position:static;display:block;width:100%}
.take.sel .th{border-color:#fff;box-shadow:none}
.take.held .th{border-color:var(--rec);box-shadow:none}
.take.now .th{border-color:var(--accent);box-shadow:none}
.take.now.sel .th{border-color:#fff;box-shadow:0 0 0 1.5px var(--accent)}
.take .th::after{display:none}
/* Projects page */
.projects{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.projhead{display:flex;align-items:center;gap:8px}
.projhead input{flex:1;min-width:0;height:32px;font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 9px}
.projhead input:focus{outline:2px solid var(--accent);outline-offset:0}
.projstate{font-size:10px;color:var(--dim);white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:11px;color:var(--dim);min-height:22px}
.crumbs button{height:22px;padding:0 6px;font-size:11px;border:0;background:transparent;color:var(--dim)}
.crumbs button.cur{color:var(--fg);font-weight:600}
.crumbs button.drop{outline:2px dashed var(--accent)}
.projlist{display:flex;flex-direction:column;gap:4px;padding:6px;position:relative}
.prow{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;min-height:46px}
.prow .hdl{display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--panel);color:#6c7380;cursor:grab;touch-action:none}
.prow .hdl svg{width:14px;height:14px}
.prow .pb{height:auto;min-height:46px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:4px 10px;border-radius:8px}
.prow .pb b{font-size:12px;font-weight:600}
.prow .pb small{font-size:10px;color:var(--dim)}
.prow.folder .pb{flex-direction:row;justify-content:flex-start;align-items:center;gap:8px;background:#1d2026}
.prow.folder .pb svg{width:16px;height:16px;color:var(--accent)}
.prow.cur .pb{border-color:var(--accent)}
.prow.held .pb{border-color:var(--rec)}
.prow.drop .pb{outline:2px dashed var(--accent);outline-offset:-2px}
.prow .ni{flex:1;height:30px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:5px;padding:0 8px}
.projfoot{display:flex;gap:8px;flex-wrap:wrap}
.projfoot button{height:30px;font-size:11px}
.projmsg{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;background:var(--raise);font-size:11px}
.projmsg button{height:26px;font-size:11px}
.projempty{color:var(--dim);line-height:1.6;padding:12px 8px}
/* v22 */
:host{--blue:#5eb0ff}
.c24{grid-column:2/5}.c26{grid-column:2/7}
#trackbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;max-width:560px;width:100%}
#trackbar select{max-width:none;width:100%;height:36px;min-width:0}
#trackbar .ic{height:36px}
#loadclip{font-size:9px;letter-spacing:.06em}
/* two-state toggles: the first state orange (accent), the second blue */
.toggle2{background:color-mix(in srgb,var(--accent) 18%,#1b1d22);border-color:var(--accent);color:var(--accent)}
.toggle2.alt{background:color-mix(in srgb,var(--blue) 18%,#1b1d22);border-color:var(--blue);color:var(--blue)}
#gamebtn[aria-pressed="true"]{background:#3a1d2c;border-color:#ff5fa2;color:#ff9ccb}
/* the field editor's and the game's bars sit over the bottom of the field */
.fieldbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:center;padding:6px;background:rgba(17,19,23,.92);border-top:1px solid var(--line);z-index:2}
.fieldbar select{flex:1;min-width:0;height:32px}
.fieldbar button{height:32px;font-size:11px}
.fieldbar .hint{flex:1;font-size:10px;color:var(--dim);line-height:1.3}
.fieldlist{display:flex;flex-direction:column;gap:4px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.frow .pb{height:auto;min-height:42px;display:flex;align-items:center;gap:8px;text-align:left;padding:4px 8px;border-radius:8px}
.frow .pb canvas{width:30px;height:36px;flex:none;border-radius:4px}
.frow .pb b{font-size:12px;font-weight:600}.frow .pb small{display:block;font-size:10px;color:var(--dim)}
.frow.cur .pb{border-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btnrow button{height:32px;font-size:11px}
/* projects sheet */
.card.big{max-width:560px;height:88%;max-height:88%}
.card.big .sess-scroll{flex:1;min-height:120px}
.prow.sel .pb{border-color:#fff}
.prow.gone .pb{background:#4a1d20;border-color:var(--rec);color:#ffb4b4}
.prow.gone{transition:opacity .25s;opacity:.55}
.projtools{display:grid;grid-template-columns:36px repeat(3,minmax(0,1fr));gap:6px}
.projtools button{height:34px;font-size:10px;letter-spacing:.06em}
</style>

<div class="app" id="app">
  <div class="side" id="side">
    <!-- v22: rows 1 and 2 are on every page; row 3 (and the lane) only on the field. Row 2's middle shows
         what is on the field (loop, field, game) there, and LOAD TO SEQUENCER on the Clips page. -->
    <header class="tgrid" id="tgrid">
      <button id="prefs" class="ic c1" aria-label="Preferences" title="Preferences"></button>
      <div class="drag c2" id="bpm" tabindex="0" role="slider" aria-label="Tempo" aria-valuemin="60" aria-valuemax="200"><b>124</b><small>BPM</small></div>
      <div class="drag c3" id="swing" tabindex="0" role="slider" aria-label="Swing" aria-valuemin="50" aria-valuemax="75"><b>50</b><small>Swing</small></div>
      <button id="export" class="ic c4" aria-label="Export" title="Export clips, the sequence, or what you just heard"></button>
      <button id="project" class="ic c5" aria-label="Projects" title="Projects"></button>
      <button id="undo" class="ic c6" aria-label="Undo" title="Undo" disabled></button>
      <button id="redo" class="ic c7" aria-label="Redo" title="Redo" disabled></button>
      <button id="sessbtn" class="ic takesbtn c8" aria-label="Clips" title="Clips"></button>
    </header>
    <div class="tgrid" id="trackbar">
      <button id="clear" class="ic trash c1" disabled aria-label="Clear" title="Tap: clear the sequence · hold and tap steps: empty just those"></button>
      <select id="sound" class="c24 fieldonly" aria-label="Loop">
        <optgroup label="Drums"><option value="break">Breakbeat</option><option value="boombap">Boom bap</option></optgroup>
        <optgroup label="Bass"><option value="acid">Acid bass</option><option value="reese">Reese bass</option><option value="dub">Dub stabs</option></optgroup>
        <optgroup label="Melodic"><option value="lead">Synth lead</option><option value="keys">Electric piano</option><option value="kalimba">Kalimba</option><option value="vox">Vocal chops</option></optgroup>
        <option value="pick">Load your own…</option>
      </select>
      <button id="fieldbtn" class="ic c5 fieldonly" aria-label="Fields" title="Fields: switch, edit or roll a layout of effect cells"></button>
      <button id="gamebtn" class="ic c6 fieldonly" aria-pressed="false" aria-label="Game" title="Game: play a 16-bar round; every bar is saved as a clip"></button>
      <button id="loadclip" class="tiny c26 clipsonly" hidden title="Load the selected clip into the sequencer to edit it">LOAD TO SEQUENCER</button>
      <button id="play" class="ic play c78" aria-pressed="false" aria-label="Play"></button>
      <input id="file" type="file" accept="audio/*" hidden><input id="projfile" type="file" accept=".json,.zip,application/json,application/zip" hidden>
    </div>
    <div class="tgrid fieldonly" id="tools">
      <button id="stepped" class="ic toggle2 c1" aria-label="Stepped values" title="Stepped or smooth effect values"></button>
      <div id="dice" class="dice c24" tabindex="0" role="slider" aria-label="Randomize the sequence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
        title="Drag the die (or tap the slider) to randomize · hold it and tap steps to randomize just those"><span id="diceval"></span><i id="die"></i></div>
      <button id="recmode" class="toggle2 tiny c5">REPLACE</button>
      <button id="fxonly" class="toggle tiny c6" aria-pressed="false">FX<br>ONLY</button>
      <button id="rec" class="ic recbtn c7" aria-pressed="false" aria-label="Record" title="Record: touches are written into the sequence"></button>
      <button id="capture" class="ic capbtn c8" aria-label="Capture" title="Capture: save the sequence as it is now to Clips"></button>
    </div>
    <canvas id="lane" class="lane" aria-label="Sequencer steps"></canvas>
  </div>
  <div class="main" id="mainpane">
    <div class="gridwrap" id="gridwrap"><canvas id="grid" aria-label="Performance strips and effect grid"></canvas>
      <div class="fieldbar" id="fieldbar" hidden></div>
    </div>
    <section class="session" id="session" hidden aria-label="Clips">
      <div class="sess-scroll" id="sessScroll"><div class="takelist" id="takelist"></div></div>
    </section>
  </div>
  <div class="ghost" id="ghost" hidden></div>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
